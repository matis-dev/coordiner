name: Release

# Publishes the version in package.json to the VS Code Marketplace and Open VSX
# when a tag named v<version> is pushed, e.g. `git tag v0.5.0 && git push origin v0.5.0`.
# Only the Marketplace job can request an OIDC token, and it runs no project code.
on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HUSKY: "0"
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: pnpm/action-setup@v6.1.0

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Check the tag matches package.json
        id: version
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $version" >&2
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - run: pnpm typecheck

      - run: pnpm test

      - name: Package
        run: pnpm dlx @vscode/vsce@4.1.0 package --no-dependencies --out "coordiner-$VERSION.vsix"

      - uses: actions/upload-artifact@v7.0.2
        with:
          name: vsix
          path: coordiner-${{ env.VERSION }}.vsix
          if-no-files-found: error

  publish-marketplace:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    env:
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24

      - uses: actions/download-artifact@v8.0.2
        with:
          name: vsix

      - name: Publish to the VS Code Marketplace
        run: npx --yes @vscode/vsce@4.1.0 publish --packagePath "coordiner-$VERSION.vsix" --oidc

  publish-openvsx:
    needs: [build, publish-marketplace]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24

      - uses: actions/download-artifact@v8.0.2
        with:
          name: vsix

      - name: Publish to Open VSX
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: npx --yes ovsx@1.3.0 publish --packagePath "coordiner-$VERSION.vsix"
